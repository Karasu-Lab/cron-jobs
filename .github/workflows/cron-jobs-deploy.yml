# Deploy workflow for this repository, modeled on the hub's existing
# api-auth / api worker workflows. This app depends on workspace packages,
# so the deploy still builds in the hub repository's tree: this workflow
# clones the hub (with its submodules) and pins this app's submodule to
# the commit that triggered the run. It requires the hub's main branch to
# carry the submodule layout, and this repository to hold the Actions
# secrets and variables referenced below under the same names.
#
# Secrets and variables are organized by GitHub Environments: the deploy
# job runs in the `production` environment and the preview job in the
# `preview` environment, and any name an environment does not define
# falls back to the repository-level secret or variable — there are no
# prefixed duplicates. Previews resolve their values from the `preview`
# environment, never from the production one.
name: cron-jobs Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: cron-jobs-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch dev https://github.com/Karasu-Lab/Karasu-Lab.git .
          git -C apps/cron-jobs fetch origin "${{ github.sha }}"
          git -C apps/cron-jobs checkout --detach "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter cron-jobs deploy

      - name: Sync worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/cron-jobs "$RUNNER_TEMP/cron-jobs-secrets.json" DATABASE_URL CRON_JOBS_API_KEY
          pnpm --filter cron-jobs exec wrangler secret bulk "$RUNNER_TEMP/cron-jobs-secrets.json"

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch dev https://github.com/Karasu-Lab/Karasu-Lab.git .
          git -C apps/cron-jobs fetch origin "${{ github.sha }}"
          git -C apps/cron-jobs checkout --detach "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/cron-jobs "$RUNNER_TEMP/cron-jobs-preview-secrets.json" DATABASE_URL CRON_JOBS_API_KEY
          pnpm --filter cron-jobs preview -- --name "${{ github.ref_name }}" --secrets-file "$RUNNER_TEMP/cron-jobs-preview-secrets.json"
