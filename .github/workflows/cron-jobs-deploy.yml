name: Cron Jobs Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: production
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/cron-jobs
          secrets-command: node .github/scripts/worker-secrets-file.mjs {app_path} "{secrets_file}" {secret_names}
          secret-names: DATABASE_URL CRON_JOBS_API_KEY
          deploy-command: pnpm --filter cron-jobs deploy
          preview-command: pnpm --filter cron-jobs preview -- --name "{branch}" --secrets-file "{secrets_file}"
          sync-command: pnpm --filter cron-jobs exec wrangler secret bulk "{secrets_file}"
          worker-name: cron-jobs

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: preview
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/cron-jobs
          secrets-command: node .github/scripts/worker-secrets-file.mjs {app_path} "{secrets_file}" {secret_names}
          secret-names: DATABASE_URL CRON_JOBS_API_KEY
          deploy-command: pnpm --filter cron-jobs deploy
          preview-command: pnpm --filter cron-jobs preview -- --name "{branch}" --secrets-file "{secrets_file}"
          sync-command: pnpm --filter cron-jobs exec wrangler secret bulk "{secrets_file}"
          worker-name: cron-jobs
